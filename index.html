<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL Engine</title>
  </head>
  <body class="p-3">
    <div id="app" class="">
      <h1 class="text-3xl mb-2">WebGL Engine Demo</h1>
      <button id="start-button" class="w-full h-10 bg-blue-400 text-white cursor-pointer">Start</button>
      <canvas
        id="webgl-canvas"
        width="480"
        height="360"
        class="[image-rendering:pixelated] w-full"
      ></canvas>
      <p class="text-sm mb-2 mt-4">Ray Trace Debug (Press Space)</p>
      <canvas
        id="debug-canvas"
        width="240"
        height="180"
        class="[image-rendering:pixelated] w-full"
      ></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
